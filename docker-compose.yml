services:
  app:
    build: .
    image: flan-t5-quantization:latest
    container_name: flan-t5-quantization
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      # Public address used in link previews (Discord, Slack...)
      PUBLIC_URL: https://flant5.sofianechaoui.com
    volumes:
      # Model weights downloaded from the Hub survive rebuilds
      - hf-cache:/cache/huggingface
    mem_limit: 8g

volumes:
  hf-cache:
